<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="./javascript/main.js" defer></script>
    <link rel="stylesheet" href="styling.css">
    <title>Cat Explorer :3</title>
</head>

<body>
    <header class="app-header">
        <h1>Cat Explorer</h1>
        <p class="tagline">Doomscrolling but there's no doom and its just cats. Search a breed and save your favorite
            felines.</p>
    </header>

    <main class="panel">
        <section class="controls">

            <div class="cat">
                <span class="ear ear-right"></span>
                <span class="ear ear-left"></span>

                <button type="button" class="button" id="cat-randomizer">
                    <img src="images/paw-button.png" alt="paw print" class="paw">
                    <span class="label">Get a Cat!</span>
                </button>
            </div>

            <form id="searchForm" class="search-form">
                <input id="searchInput" class="searchInput" type="text" placeholder="Search a Breed">
                <button type="submit" class="search-button">Search</button>
            </form>

             <button type="button" id="favorites-button" class="favorites">My Favorites</button>
            </section>

            <p id="status" class="status"></p>
            <section id="gallery" class="gallery"></section>
            </main>
            </body>
            </html>
